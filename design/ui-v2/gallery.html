<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>密卷提案 · 图鉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
</head>
<body class="folio">
  <div class="tome">
    <img class="bookmark" src="../../public/ui/ribbon_bookmark.png" alt="" />
    <p class="sample-flag">示例</p>
    <div class="cover">
      <div class="sheet">
        <i class="gutter" aria-hidden="true"></i>
        <header class="running">
          <div><p class="kicker">珍藏</p><h1 class="folio-title">图鉴</h1></div>
          <button class="text-ink" type="button">返回</button>
        </header>
        <div class="tabs" role="group" aria-label="形态">
          <button class="tab" type="button" aria-pressed="true">人形</button>
          <button class="tab" type="button">按住查看魔物</button>
        </div>
        <div class="gallery-layout">
          <nav class="rail" aria-label="关卡">
            <button type="button">月下封林 <small>3</small></button>
            <button type="button">玫瑰古堡 <small>3</small></button>
            <button type="button">钟械秘阁 <small>3</small></button>
            <button type="button" aria-current="true">琥珀龙窟 <small>2</small></button>
            <button type="button">月蚀歌剧院 <small>0</small></button>
            <button type="button">雷纹天城 <small>—</small></button>
            <button type="button">星陨神座 <small>—</small></button>
            <button type="button">万象封门 <small>—</small></button>
          </nav>
          <section>
            <p class="kicker">第十六关 · 龙裔</p>
            <h2 class="section-title" style="margin-left:0">琥珀龙窟</h2>
            <div class="mounts">
              <button class="mount is-open" type="button" style="--accent:#c4843a"><figure>通关<span class="c"></span></figure><b>通关解封</b><small>通关后收下的画像</small></button>
              <button class="mount is-open" type="button" style="--accent:#e0b56a"><figure>满血<span class="c"></span></figure><b>满血通关</b><small>通关时生命全满</small></button>
              <button class="mount" type="button" disabled><figure><span class="band">未解封条</span><img class="seal" src="../../public/ui/wax_seal_red.png" alt="" /><span class="c"></span></figure><b>击败 Boss</b><small>未解开 · 击败琥珀龙君</small></button>
            </div>
            <p class="note">色块与封条只占位置。正式原画仍用游戏资源。收录数是示例。</p>
          </section>
        </div>
        <footer class="foot"><span>示例：收录不是真实图鉴</span><span>贴页</span></footer>
      </div>
    </div>
  </div>
</body>
</html>
