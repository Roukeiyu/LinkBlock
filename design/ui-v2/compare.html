<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>密卷 · 从简洁到繁复</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
</head>
<body class="folio long">
  <div class="tome">
    <div class="cover">
      <div class="sheet doc">
        <p class="kicker">对照</p>
        <h1>从干净书页到密卷</h1>
        <p>左是上一稿的干净排版，右是这一稿。右图的进度和分数都是示例，局内图形是示意。线上游戏的原截图仍在 <code>captures/current/</code>。</p>
        <h2>主菜单</h2>
        <div class="pair">
          <figure><img src="captures/plain/desktop-menu.png" alt="简洁书页主菜单" /><figcaption>上一稿 · 干净目录</figcaption></figure>
          <figure><img src="captures/proposed/desktop-menu.png" alt="繁复主菜单" /><figcaption>这一稿 · 符文、夹页、火漆</figcaption></figure>
        </div>
        <h2>选关</h2>
        <div class="pair">
          <figure><img src="captures/plain/desktop-levels.png" alt="简洁选关" /><figcaption>上一稿</figcaption></figure>
          <figure><img src="captures/proposed/desktop-levels.png" alt="繁复选关" /><figcaption>这一稿 · 名册票券</figcaption></figure>
        </div>
        <h2>局内 · 桌面</h2>
        <div class="pair">
          <figure><img src="captures/plain/desktop-play.png" alt="简洁局内" /><figcaption>上一稿</figcaption></figure>
          <figure><img src="captures/proposed/desktop-play.png" alt="繁复局内" /><figcaption>这一稿 · 花边框与页边栏</figcaption></figure>
        </div>
        <h2>局内 · 手机</h2>
        <div class="pair">
          <figure><img src="captures/plain/mobile-play.png" alt="简洁手机局内" /><figcaption>上一稿</figcaption></figure>
          <figure><img src="captures/proposed/mobile-play.png" alt="繁复手机局内" /><figcaption>这一稿</figcaption></figure>
        </div>
        <h2>图鉴</h2>
        <div class="pair">
          <figure><img src="captures/plain/desktop-gallery.png" alt="简洁图鉴" /><figcaption>上一稿</figcaption></figure>
          <figure><img src="captures/proposed/desktop-gallery.png" alt="繁复图鉴" /><figcaption>这一稿 · 贴页与封条</figcaption></figure>
        </div>
        <h2>胜利</h2>
        <div class="pair">
          <figure><img src="captures/plain/desktop-win.png" alt="简洁胜利" /><figcaption>上一稿</figcaption></figure>
          <figure><img src="captures/proposed/desktop-win.png" alt="繁复胜利" /><figcaption>这一稿 · 夹入的一叶</figcaption></figure>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
