<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>密卷提案 · 审阅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
</head>
<body class="folio">
  <div class="tome">
    <img class="bookmark" src="../../public/ui/ribbon_bookmark.png" alt="" />
    <div class="cover">
      <div class="sheet">
        <i class="gutter" aria-hidden="true"></i>
        <header class="running">
          <div><p class="kicker">封林 / 美术审阅</p><h1 class="folio-title">全关卡奖励图片</h1></div>
        </header>
        <nav class="tabs" aria-label="审阅">
          <button class="tab" type="button" aria-pressed="true">奖励图片</button>
          <button class="tab" type="button">Boss / 小怪</button>
          <button class="tab" type="button" aria-pressed="true">人形</button>
          <button class="tab" type="button">魔物</button>
        </nav>
        <p class="note">外框换成这册书。原图、顺序、放大和遮罩都不换。</p>
        <h2 class="section-title">第一关 · 月下封林</h2>
        <div class="review-grid">
          <figure class="mount"><div class="ph">原图位<span class="c"></span></div><figcaption>完整成图<small>仍读游戏资源</small></figcaption></figure>
          <figure class="mount"><div class="ph">原图位<span class="c"></span></div><figcaption>满血通关<small>切图与下载照旧</small></figcaption></figure>
          <figure class="mount"><div class="ph">原图位<span class="c"></span></div><figcaption>击败 Boss<small>蚀根</small></figcaption></figure>
        </div>
        <h2 class="section-title">第十五关 · 钟械秘阁</h2>
        <div class="review-grid">
          <figure class="mount"><div class="ph">原图位<span class="c"></span></div><figcaption>完整成图<small>Alpha 仍对照正式遮罩</small></figcaption></figure>
          <figure class="mount"><div class="ph">原图位<span class="c"></span></div><figcaption>满血通关<small>机心造物</small></figcaption></figure>
          <figure class="mount"><div class="ph">原图位<span class="c"></span></div><figcaption>击败 Boss<small>自鸣机兽</small></figcaption></figure>
        </div>
        <footer class="foot"><span>斜线框是占位，不是新角色</span><span>审阅</span></footer>
      </div>
    </div>
  </div>
</body>
</html>
