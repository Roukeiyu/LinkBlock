name: Deploy LinkBlock to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test game rules
        # Avoid CPU contention between the geometry and opening stress suites.
        run: npm test -- --maxWorkers=1
      - name: Install browser for audio regression tests
        run: npx playwright install --with-deps chromium
      - name: Test music playback and campaign assets
        run: |
          npm run test:e2e -- tests/audio.spec.ts tests/expansion.spec.ts tests/rewards.spec.ts tests/powerups.spec.ts tests/clear-progress.spec.ts
          npm run test:e2e -- tests/game.spec.ts --grep "pause, sound, restart and background pause|island coast stays visible and walkable at the frame"
      - name: Test drawing magnetism and coast controls
        run: |
          npm run test:e2e -- tests/snapping.spec.ts tests/junction.spec.ts
          npm run test:e2e -- tests/game.spec.ts --grep "manual reverse"
      - name: Build website
        run: npm run build
      - name: Test level balance and artwork UI
        run: npm run test:e2e -- tests/level-combat.spec.ts tests/art-review.spec.ts tests/title-menu.spec.ts tests/opening.spec.ts tests/character-form.spec.ts
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
