<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>第二期魔物完成图 · 草稿对照</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}
    body{margin:0;background:#17181c;color:#eee8dd;font:16px/1.65 system-ui,sans-serif}
    header,main{max-width:1180px;margin:auto;padding:28px}header{padding-bottom:4px}
    h1{font-size:clamp(26px,4vw,38px);line-height:1.25;margin:6px 0 12px}h2{font-size:20px;margin:0}
    p{color:#bfb8ac;margin:8px 0}a{color:#edca8e}header small{color:#d7b77c;letter-spacing:.1em}
    .notice{border-left:3px solid #d7ad6e;padding:10px 14px;background:#312a22;color:#f2dcc1;border-radius:0 8px 8px 0}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav a{border:1px solid #5a5142;border-radius:7px;padding:4px 11px;text-decoration:none}
    section{margin:0 0 30px;padding:18px;border:1px solid #454047;border-radius:12px;background:#222329;scroll-margin:16px}
    .heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.heading span{color:#aa9c87;font-size:13px}
    .compare{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:8px;background:#111}
    .compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .compare .draft{clip-path:inset(0 0 0 var(--split,50%))}
    .compare .divider{position:absolute;left:var(--split,50%);top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 4px #000}
    .tag{position:absolute;top:12px;padding:3px 9px;border-radius:5px;background:#151515bf;color:white;font-size:13px;pointer-events:none}.tag.human{left:12px}.tag.monster{right:12px}
    .actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}.actions label{flex:1;min-width:180px;color:#d3c7b3;font-size:14px}.actions input{display:block;width:100%;accent-color:#e5bc77;cursor:ew-resize}.actions a{white-space:nowrap}
    @media(max-width:600px){header,main{padding:18px 12px}section{padding:10px}.tag{top:7px;font-size:12px}.tag.human{left:7px}.tag.monster{right:7px}}
  </style>
</head>
<body>
  <header>
    <small>封林 / 第二期角色审阅</small>
    <h1>魔物形态 · 完成图草稿</h1>
    <p>第 11～20 关。拖动滑杆，对照左侧人形原图与右侧魔物草稿；可打开或保存草稿原图。</p>
    <p class="notice">这些图供确认角色形态。背景采用相同场景，但生成时部分细节有重绘，尚未做到完全一致。</p>
    <nav aria-label="跳转关卡" id="navigation"></nav>
  </header>
  <main id="levels"></main>
  <script>
    const names = ['蜘蛛妖','鹿人','牛头人','蛇妖','机心造物','龙裔','歌剧魅影','雷兽','堕星看守','封门主宰'];
    const nav = document.querySelector('#navigation'), container = document.querySelector('#levels');
    names.forEach((name,index) => {
      const id = index + 11, version = id === 17 ? 'scene-v2' : 'scene-v1';
      const link = document.createElement('a'); link.href = '#level-' + id; link.textContent = id; nav.append(link);
      const section = document.createElement('section'); section.id = 'level-' + id;
      section.innerHTML = `<div class="heading"><h2>第 ${id} 关 · ${name}</h2><span>人形原图 / 魔物草稿</span></div>
        <div class="compare" style="--split:50%">
          <img src="../../levels/${id}/${version}/restored.webp" alt="第 ${id} 关人形完成原图" loading="lazy" width="1536" height="1024">
          <img class="draft" src="${id}.png" alt="第 ${id} 关${name}魔物完成图草稿" loading="lazy" width="1536" height="1024">
          <span class="divider" aria-hidden="true"></span><span class="tag human">人形原图</span><span class="tag monster">魔物草稿</span>
        </div>
        <div class="actions"><label>拖动对照<input type="range" min="0" max="100" value="50" aria-label="第 ${id} 关人形和魔物图对照"></label><a href="${id}.png" target="_blank" rel="noopener">打开草稿原图</a><a href="${id}.png" download="level-${id}-monster-draft.png">保存草稿</a></div>`;
      const compare = section.querySelector('.compare');
      section.querySelector('input').addEventListener('input', event => compare.style.setProperty('--split', event.target.value + '%'));
      container.append(section);
    });
  </script>
</body>
</html>
